[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-extract"
version = "0.1.0"
description = "Extracts item codes from mixed sources and measures whether it got them all"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
excel = ["openpyxl>=3.1"]

[project.scripts]
multi-extract = "multi_extract.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_extract"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
